# Canonical config for branch feature/team-stats-spearman-surrogate:
# Model A with standing rank as team-stat input + Spearman-surrogate loss.

paths:
  outputs: "outputs_team_stats_spearman_surrogate"

training:
  loss_type: "spearman_surrogate"
  listmle_target: "playoff_outcome"
  loss_tau: 1.0
  rolling_windows: [10, 30]

model_a:
  stat_dim: 22
  use_standing_rank: true
