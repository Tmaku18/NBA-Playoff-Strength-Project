# Wide sweep: team-stats GPR (Gaussian Process Regression) enabled. Same Optuna search; also trains/saves GPR team-stats model.
paths:
  outputs: "output/team_stats_gpr"

training:
  train_team_stats_linear: false
  train_team_stats_bayesian_ridge: false
  train_team_stats_gpr: true
  train_team_stats_gmm: false
  listmle_target: "playoff_outcome"
  loss_type: "listmle"
  rolling_windows: [10, 30]
