# Improved best-model run (8_spearman_surrogate, based on sweep combo_0033).
# Implements docs/PROJECT_STATE_AND_BEST_MODELS_02-27.md ranked improvements:
#   1. Fixed Spearman-surrogate sign (code fix in src/models/ranking_surrogate_losses.py:
#      higher Model A score now = stronger team; meta no longer has to invert A).
#   2. Standings as extra stacking column (stacking.use_standings: true -> meta gets
#      win-rate-to-date as a 3rd/5th column, anchoring on the standings baseline).
#   5. Confidence-weighted stacking (stacking.use_confidence: true -> 4/5-col meta).
#   6. Lifted training caps (max_lists_oof/max_final_batches 100 -> 250) + early
#      stopping (patience 4, val_frac 0.25, epochs 20).
#   7. True per-conference metas (script 4b now fits ridgecv_meta_E/W on
#      conference-only OOF rows automatically).
# Improvement 3 (top-weighted loss) is the separate config 8_spearman_improved_topweighted.yaml.
# Improvement 4 (flag ablation) is: python -m scripts.sweep_hparams --phase flags --config config/8_spearman_improved.yaml --n-jobs 3
#
# Run: python -m scripts.run_pipeline_from_model_a --config config/8_spearman_improved.yaml

seasons:
  2014-15:
    start: '2014-10-01'
    end: '2015-04-15'
  2015-16:
    start: '2015-10-01'
    end: '2016-04-15'
  2016-17:
    start: '2016-10-01'
    end: '2017-04-15'
  2017-18:
    start: '2017-10-01'
    end: '2018-04-15'
  2018-19:
    start: '2018-10-01'
    end: '2019-04-15'
  2019-20:
    start: '2019-10-01'
    end: '2020-04-15'
  2020-21:
    start: '2020-12-01'
    end: '2021-05-15'
  2021-22:
    start: '2021-10-01'
    end: '2022-04-15'
  2022-23:
    start: '2022-10-01'
    end: '2023-04-15'
  2023-24:
    start: '2023-10-01'
    end: '2024-04-15'
  2024-25:
    start: '2024-10-01'
    end: '2025-04-15'
  2025-26:
    start: '2025-10-01'
    end: '2026-04-15'
paths:
  db: data/processed/nba_build_run.duckdb
  raw: data/raw
  processed: data/processed
  outputs: output/8_spearman_surrogate/improved_02-27/outputs
  batch_cache: data/processed/batch_cache
  feature_cache: data/processed/feature_cache
build_db:
  skip_if_exists: true
repro:
  seed: 42
model_a:
  stat_dim: 21
  num_embeddings: 500
  embedding_dim: 32
  encoder_hidden:
  - 128
  - 64
  attention_heads: 4
  dropout: 0.2
  learning_rate: 0.0001
  grad_clip_max_norm: 5.0
  # Improvement 6: more epochs guarded by early stopping instead of fixed 15 epochs.
  epochs: 20
  early_stopping_patience: 4
  early_stopping_min_delta: 0.0
  early_stopping_val_frac: 0.25
  minutes_bias_weight: 0.3
  minutes_sum_min: 1.0e-06
  attention_debug: false
  attention_fallback_strategy: minutes
  attention:
    temperature: 3
    multi_temp_enabled: true
    temperatures:
    - 1
    - 5
    - 10
    multi_temp_base_weights:
      1: 0.85
      5: 1.0
      10: 0.7
    use_availability_in_aggregation: true
    use_availability_in_attention: false
  use_amp: true
  confidence:
    entropy_weight: 0.5
    max_weight_weight: 0.5
model_b:
  include_features: null
  # standing_rank_norm is the rank of Model B's own training target (win rate to date);
  # leaving it in makes XGB a standings echo (0.61 importance, OOF 0.985, test 0.07).
  # The standings signal reaches the ensemble via the stacking column instead.
  exclude_features:
  - standing_rank_norm
  xgb:
    n_estimators: 250
    max_depth: 6
    learning_rate: 0.07963763436288537
    early_stopping_rounds: 20
    subsample: 0.8
    colsample_bytree: 0.7
  rf:
    n_estimators: 200
    max_depth: 12
    min_samples_leaf: 5
  lr:
    C: 1.0
    max_iter: 1000
stacking:
  # Improvement 5: confidence-weighted stacking (4/5-col meta).
  use_confidence: true
  # Improvement 2: standings win rate to date as extra stacking column.
  use_standings: true
  xgb_weight: null
training:
  train_model_c: false
  loss_type: spearman_surrogate
  loss_tau: 1.0
  n_folds: 5
  rolling_windows:
  - 10
  - 30
  roster_size: 15
  target_rank: playoffs
  listmle_target: playoff_outcome
  train_seasons:
  - 2015-16
  - 2016-17
  - 2017-18
  - 2018-19
  - 2019-20
  - 2020-21
  - 2021-22
  - 2022-23
  test_seasons:
  - 2023-24
  - 2024-25
  validation_seasons:
  - 2023-24
  holdout_seasons:
  - 2024-25
  train_test_cutoff: null
  train_frac: 0.75
  # Improvement 6: lift caps from 100 to 250 (uses more training lists; caches keep cost manageable).
  max_lists_oof: 250
  max_final_batches: 250
  walk_forward: false
  use_prior_season_baseline: true
  prior_season_lookback_days: 365
output:
  true_strength_scale: percentile
  odds_temperature: 0.5
  championship_odds_method: softmax
  ig_inference_top_k: 1
  ig_inference_steps: 50
uncertainty:
  enabled: true
  method: mc_rank_interval
  mc_samples: 200
  alpha: 0.1
  score_std_floor: 1.0e-06
  conf_to_std_scale: 0.25
elo:
  cold_start_games: 10
  regression_to_mean: 0.25
  enabled: true
massey:
  enabled: true
sos_srs:
  data_path: data/raw/Team_Records.csv
  enabled: false
team_rolling:
  enabled: false
injury:
  data_path: data/raw/injury_reports
  minutes_heuristic: proportional
  enabled: false
motivation:
  late_season_games: 15
  playoff_wins_threshold: 42
  enabled: true
raptor:
  data_path: docs/modern_RAPTOR_by_team.csv
  enabled: true
monte_carlo:
  hca: 100.0
  rating_scale: 400.0
  n_seasons: 10000
  n_series: 1000
logging:
  roster_debug: false
  playoff_debug: false
sweep:
  model_a_epochs:
  - 16
  - 28
  rolling_windows:
  - - 10
    - 30
  model_a_attention_extra_temperatures:
  - []
  model_b:
    max_depth:
    - 3
    - 4
    learning_rate:
    - 0.08
    n_estimators_xgb:
    - 250
    - 300
    n_estimators_rf:
    - 200
    subsample:
    - 0.8
    colsample_bytree:
    - 0.7
    min_samples_leaf:
    - 5
  include_clone_classifier: false
inference:
  run_id: null
  run_id_base: 25
  also_train_predictions: false
  require_eos_final_rank: false
