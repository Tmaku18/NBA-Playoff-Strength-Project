paths:
  db: C:/Users/tmaku/OneDrive/Documents/GSU/Advanced Machine Learning/NBA Playoff
    Strentgh Project/data/processed/nba_build.duckdb
  raw: data/raw
  processed: data/processed
  outputs: output/4_listmle
  # Batch cache (script 3): reuse built batches across combos when config/DB unchanged. Set null to disable.
  batch_cache: data/processed/batch_cache
  # Feature cache (script 4): reuse build_team_context_as_of_dates output. Set null to disable.
  feature_cache: data/processed/feature_cache
build_db:
  skip_if_exists: true
repro:
  seed: 42
model_a:
  stat_dim: 24  # no standing_rank in Model A (removed); 20 player stats (L10+L30+on_off) + 1 continuity + 3 usage/positional
  top_n_player_stats: null  # optional: use first N columns from PLAYER_STAT_COLS_WITH_ON_OFF (e.g. 10)
  player_stat_cols: null  # optional explicit subset list of Model A player stat columns
  num_embeddings: 500
  embedding_dim: 32
  encoder_hidden:
  - 128
  - 64
  attention_heads: 4
  dropout: 0.2
  learning_rate: 0.0001
  grad_clip_max_norm: 5.0
  epochs: 27
  early_stopping_patience: 0
  early_stopping_min_delta: 0.0
  early_stopping_val_frac: 0.25
  minutes_bias_weight: 0.3
  minutes_sum_min: 1.0e-06
  attention_debug: false
  attention_fallback_strategy: minutes
  attention:
    temperature: 3
    multi_temp_enabled: true
    temperatures:
    - 1
    - 5
    - 10
    multi_temp_base_weights:
      1: 0.85
      5: 1.0
      10: 0.7
    use_availability_in_aggregation: true
    use_availability_in_attention: false
  use_amp: true
  confidence:
    entropy_weight: 0.5
    max_weight_weight: 0.5
model_b:
  include_features: null
  exclude_features: []
  xgb:
    n_estimators: 229
    max_depth: 5
    learning_rate: 0.072
    early_stopping_rounds: 20
    subsample: 0.8
    colsample_bytree: 0.7
  rf:
    n_estimators: 200
    max_depth: 12
    min_samples_leaf: 5
team_stats_models:
  # If true, adds Model A OOF score at train time (merge on team_id+as_of_date) and live Model A score at inference time.
  include_model_a_score: false
  linear:
    fit_intercept: true
  bayesian_ridge:
    alpha_1: 1.0e-06
    alpha_2: 1.0e-06
    lambda_1: 1.0e-06
    lambda_2: 1.0e-06
  gpr:
    kernels: [rbf, matern, rational_quadratic]
    normalize_y: true
    alpha: 1.0e-06
    n_restarts_optimizer: 1
    rbf:
      length_scale: 1.0
      length_scale_bounds: [1.0e-02, 100.0]
    matern:
      length_scale: 1.0
      length_scale_bounds: [1.0e-02, 100.0]
      nu: 1.5
    rational_quadratic:
      length_scale: 1.0
      alpha: 1.0
  gmm:
    n_components_grid: [1, 2, 3, 4, 5]
    covariance_type_grid: [full, diag]
    random_state: 42
stacking:
  use_confidence: false
  xgb_weight: null
training:
  train_model_c: false
  train_team_stats_linear: false
  train_team_stats_bayesian_ridge: false
  train_team_stats_gpr: false
  train_team_stats_gmm: false
  loss_type: listmle
  loss_tau: 1.0
  n_folds: 5
  rolling_windows:
  - 15
  - 30
  roster_size: 15
  target_rank: playoffs
  listmle_target: final_rank
  train_seasons:
  - 2015-16
  - 2016-17
  - 2017-18
  - 2018-19
  - 2019-20
  - 2020-21
  - 2021-22
  - 2022-23
  test_seasons:
  - 2023-24
  - 2024-25
  validation_seasons:
  - 2023-24
  holdout_seasons:
  - 2024-25
  train_test_cutoff: null
  train_frac: 0.75
  max_lists_oof: 100
  max_final_batches: 100
  walk_forward: false
  use_prior_season_baseline: true
  prior_season_lookback_days: 365
output:
  true_strength_scale: percentile
  odds_temperature: 0.5
  championship_odds_method: softmax
  ig_inference_top_k: 1
  ig_inference_steps: 50
uncertainty:
  enabled: true
  method: mc_rank_interval
  mc_samples: 200
  alpha: 0.1
  score_std_floor: 1.0e-06
  conf_to_std_scale: 0.25
elo:
  cold_start_games: 10
  regression_to_mean: 0.25
  enabled: true
massey:
  enabled: true
sos_srs:
  data_path: data/raw/Team_Records.csv
  enabled: false
team_rolling:
  enabled: false
injury:
  data_path: data/raw/injury_reports
  minutes_heuristic: proportional
  enabled: false
motivation:
  late_season_games: 15
  playoff_wins_threshold: 42
  enabled: true
raptor:
  data_path: docs/modern_RAPTOR_by_team.csv
  enabled: true
monte_carlo:
  hca: 100.0
  rating_scale: 400.0
  n_seasons: 10000
  n_series: 1000
logging:
  roster_debug: false
  playoff_debug: false
sweep:
  model_a_epochs:
  - 16
  - 28
  rolling_windows:
  - - 10
    - 30
  model_a_attention_extra_temperatures:
  - []
  model_b:
    max_depth:
    - 3
    - 4
    learning_rate:
    - 0.08
    n_estimators_xgb:
    - 250
    - 300
    n_estimators_rf:
    - 200
    subsample:
    - 0.8
    colsample_bytree:
    - 0.7
    min_samples_leaf:
    - 5
  include_clone_classifier: false
inference:
  run_id: null
  run_id_base: 25
  also_train_predictions: false
  also_validation_predictions: false  # when true, write val_predictions.json (last 20% of train dates); eval_report gets val_metrics_*
  require_eos_final_rank: false
