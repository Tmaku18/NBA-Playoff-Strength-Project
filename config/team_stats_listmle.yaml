# Canonical config for branch feature/team-stats-listmle:
# Model A with standing rank as team-stat input + ListMLE loss.

paths:
  outputs: "outputs_team_stats_listmle"

training:
  loss_type: "listmle"
  listmle_target: "final_rank"
  rolling_windows: [15, 30]

model_a:
  stat_dim: 22
  use_standing_rank: true
